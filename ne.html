<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
</head>
<body>
    LOGIN
    <a href="gathering.html">Recepção</a>
</body class="body-login" >
  <main >
  <div class="login-box">
    <h1 class="h1login">Seja Muito Bem-vindo(a)!</h1>
    <p class="frase">Entre para confirmar a presença e ver o endereço</p>
    <form id="loginForm">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="Usuário" required />
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Senha" required />
      <button class="submit" type="submit">Entrar</button>
    </form>
    <div id="tentativasMsg" class="tentativas"></div>
    <div class="hint">Usuário e Senha que enviamos no Whatsapp</div>
  </div>
</main>
  <script>
    document.body.style.opacity = '1';

    const form = document.getElementById('loginForm');
    const tentativasMsg = document.getElementById('tentativasMsg');
    const loginBox = document.querySelector('.login-box');
    let tentativas = 0;
    let bloqueado = false;

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      if (bloqueado) return;

      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();

      if (user === 'recepção' && pass === '04042026') {
        localStorage.setItem("auth", "true");
        window.location.href = 'gathering.html';
      } else {
        tentativas++;
        tentativasMsg.textContent = `Tentativa ${tentativas} de 3`;
        alert('Usuário ou senha incorretos. Tentativa: ' + tentativas + ' de 3.');

        if (tentativas >= 3) {
          bloqueado = true;
          tentativasMsg.textContent = `Acesso bloqueado por 15 segundos...`;
          loginBox.classList.add('bloqueado');

          setTimeout(() => {
            tentativas = 0;
            bloqueado = false;
            loginBox.classList.remove('bloqueado');
            tentativasMsg.textContent = '';
            alert('Login desbloqueado. Você pode tentar novamente.');
          }, 15000); // 15 segundos
        }
      }
    });
  </script>
</body>
</html>
