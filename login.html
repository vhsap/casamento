<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">                
                <!-- Aqui vai uma imagem nas CSS-->
            </div>
            <div id="formulario">
                <h1>Seja muito bem-vindo(a)!</h1>
                <p>Entre para confirmar a presença e ver o endereço.</p>
                <form id="loginForm" action="home.html" method="post" autocomplete="on">
                    <div class="campo">
                        <i class="material-icons">person</i>
                        <input type="text" name="login" id="ilogin" placeholder="Usuário" required maxlength="30">
                        <label for="ilogin">Usuário</label>
                    </div>
                    <div class="campo">
                        <i class="material-icons">vpn_key</i>
                        <input type="password" name="senha" id="isenha" placeholder="Senha" autocomplete="current-password" required minlength="8" maxlength="20">
                        <label for="isenha">Senha</label>
                    </div>
                    <div id="tentativasMsg" class="tentativas"></div>
                    <input type="submit" value="Entrar">
                    <!--<a href="#" class="botao">Esqueci a senha <i class="material-icons">mail</i></a>-->
                </form>
            </div>
        </section>
    </main>
    <script>
    document.body.style.opacity = '1';

    const form = document.getElementById('loginForm');
    const tentativasMsg = document.getElementById('tentativasMsg');
    const loginBox = document.querySelector('.formulario');
    let tentativas = 0;
    let bloqueado = false;

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      if (bloqueado) return;

      const user = document.getElementById('ilogin').value.trim().toLowerCase();
      const pass = document.getElementById('isenha').value.trim();

      if (user === 'recepção' && pass === '04042026') {
        localStorage.setItem("auth", "true");
        window.location.href = 'home.html';
      } else {
        tentativas++;
        tentativasMsg.textContent = `Tentativa ${tentativas} de 3`;
        alert('Usuário ou senha incorreto! Tentativa: ' + tentativas + ' de 3.');

        if (tentativas >= 3) {
          bloqueado = true;
          tentativasMsg.textContent = `Acesso bloqueado por 15 segundos...`;
          loginBox.classList.add('bloqueado');
            //time out não está funcionando não sei porque
          setTimeout(() => {
            tentativas = 0;
            bloqueado = false;
            loginBox.classList.remove('bloqueado');
            tentativasMsg.textContent = '';
            alert('Login desbloqueado. Você pode tentar novamente.');
          }, 5000); // 15 segundos
        }
      }
    });
  </script>
</body>
</html>
